<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fafbf9">
  <meta name="description" content="Dal Studio — кабинет эксперта: курсы с видео, прогнозы, ученики и доход.">
  <title>Dal Studio</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../studio.css">
  <script src="../assets/lucide.min.js" defer></script>
  <script src="../studio-data.js" defer></script>
  <script src="studio.js" defer></script>
</head>
<body class="studio">
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="studio-top">
    <div class="studio-brand">
      <a class="brand" href="#overview" aria-label="Dal Studio — обзор">Dal<span class="brand-dot"></span></a>
      <span class="studio-badge">Studio</span>
    </div>
    <nav class="studio-nav" id="studioNav" aria-label="Разделы кабинета"></nav>
    <div class="header-actions">
      <button class="icon-button theme-toggle" data-action="theme" aria-label="Переключить тему" title="Светлая / тёмная тема"><i data-lucide="moon"></i></button>
      <button class="user-trigger" data-action="profile-menu" aria-label="Меню эксперта" aria-expanded="false" aria-controls="profileMenu"><span class="user-avatar" id="studioAvatar"></span><i data-lucide="chevron-down"></i></button>
    </div>
    <div class="profile-menu popover" id="profileMenu" hidden></div>
  </header>
  <main id="main" class="studio-main" tabindex="-1"></main>
  <dialog id="modal" aria-labelledby="modalTitle"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
